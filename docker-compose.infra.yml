version: '3.8'

services:
  aurax-postgres:
    image: pgvector/pgvector:pg16
    container_name: aurax-postgres
    restart: always
    environment:
      POSTGRES_USER: aurax
      POSTGRES_PASSWORD: aurax_local
      POSTGRES_DB: aurax
    ports:
      - "5432:5432"
    volumes:
      - aurax-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurax"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurax-network

  aurax-mongo:
    image: mongo:7.0.4
    container_name: aurax-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: aurax
      MONGO_INITDB_ROOT_PASSWORD: aurax_local
    ports:
      - "27017:27017"
    volumes:
      - aurax-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand(\"ping\")"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurax-network

  aurax-redis:
    image: redis:7.2.4-alpine
    container_name: aurax-redis
    restart: always
    command: redis-server --requirepass aurax_local
    ports:
      - "6379:6379"
    volumes:
      - aurax-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "aurax_local", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurax-network

  aurax-neo4j:
    image: neo4j:5.15.0
    container_name: aurax-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/aurax_local
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - aurax-neo4j-data:/data
      - aurax-neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p aurax_local 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - aurax-network

  aurax-kafka:
    image: bitnami/kafka:3.6.1
    container_name: aurax-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_KRAFT_CLUSTER_ID: oS_u3w29T6aO21_rP9R92g
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@aurax-kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://aurax-kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - aurax-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aurax-network

  aurax-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    container_name: aurax-kafka-ui
    restart: always
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aurax-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: aurax-kafka:9092
    depends_on:
      aurax-kafka:
        condition: service_healthy
    networks:
      - aurax-network

  aurax-prometheus:
    image: prom/prometheus:v2.48.1
    container_name: aurax-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aurax-prometheus-data:/prometheus
    networks:
      - aurax-network

  aurax-grafana:
    image: grafana/grafana:10.2.3
    container_name: aurax-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: aurax_local
    volumes:
      - aurax-grafana-data:/var/lib/grafana
    networks:
      - aurax-network

  aurax-mailpit:
    image: axllent/mailpit:v1.12.0
    container_name: aurax-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - aurax-network

volumes:
  aurax-postgres-data:
  aurax-mongo-data:
  aurax-redis-data:
  aurax-neo4j-data:
  aurax-neo4j-plugins:
  aurax-kafka-data:
  aurax-prometheus-data:
  aurax-grafana-data:

networks:
  aurax-network:
    driver: bridge
